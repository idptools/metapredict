[build-system]
requires = ["setuptools>=77", "cython>=3.0", "numpy>=2.0", "versioningit~=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metapredict"
dynamic = ["version"]
description = "A machine learning-based tool for predicting protein disorder."
authors = [
    {name = "Ryan Emenecker", email = "remenecker@wustl.edu"}
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
readme = "README.md"
keywords = [
    "protein",
    "intrinsic disorder",
    "intrinsically disordered region",
    "IDR",
    "bioinformatics",
    "machine learning",
    "AlphaFold2",
    "pLDDT",
]

# NOTE: no "License ::" classifier here - the SPDX `license` field above is the
# modern (PEP 639) way to declare the license, and setuptools>=77 rejects mixing
# the two.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # torch 2.3 is the oldest release compatible with NumPy 2.x; older torch was
    # built against NumPy 1.x and fails to import under NumPy 2.x (verified with
    # the PyTorch sweep in tox.ini). NumPy 2.0 is the floor for the whole project.
    "torch >= 2.3",
    "numpy >= 2.0",
    "matplotlib",
    "protfasta >= 0.1.25",
    # scipy 1.13 is the oldest release compatible with NumPy 2.x (older scipy
    # requires NumPy < 2, so it will not resolve alongside numpy >= 2.0).
    "scipy >= 1.13",
    "urllib3",
    "tqdm",
    "getSequence >= 2.2.1",
]

[project.urls]
Homepage = "https://metapredict.net"
Documentation = "https://metapredict.readthedocs.io"
Repository = "https://github.com/idptools/metapredict"
Changelog = "https://github.com/idptools/metapredict/blob/master/changelog.md"
Paper = "https://doi.org/10.1016/j.bpj.2021.08.039"

[project.optional-dependencies]
test = [
  "pytest>=6.1.2",
  "pytest-cov",
]


[project.scripts]
metapredict-graph-disorder = "metapredict.scripts.metapredict_graph_disorder:main"
metapredict-predict-disorder = "metapredict.scripts.metapredict_predict_disorder:main"
metapredict-quick-graph = "metapredict.scripts.metapredict_quick_graph:main"
metapredict-quick-predict = "metapredict.scripts.metapredict_quick_predict:main"
metapredict-uniprot = "metapredict.scripts.metapredict_uniprot:main"
metapredict-predict-idrs = "metapredict.scripts.metapredict_predict_idrs:main"
metapredict-graph-pLDDT = "metapredict.scripts.metapredict_graph_pLDDT:main"
metapredict-predict-pLDDT = "metapredict.scripts.metapredict_predict_pLDDT:main"
metapredict-name = "metapredict.scripts.metapredict_name:main"
metapredict-caid = "metapredict.scripts.metapredict_caid:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
where = ["."]
include = ["metapredict", "metapredict.*"]  # Discover all sub-packages under metapredict
# analysis/ holds development-only scripts (CAID benchmarking, training-score
# generation) plus several MB of data, and needs packages that are not runtime
# dependencies (scikit-learn, alphaPredict), so it is not shipped in the wheel.
# MANIFEST.in prunes it from the sdist too.
exclude = ["metapredict.analysis", "metapredict.analysis.*"]

[tool.setuptools.package-data]
metapredict = ["py.typed"]

[tool.cibuildwheel]
# Prebuilt wheels (built by .github/workflows/wheels.yml) mean users can install
# metapredict, including its compiled Cython extension, without a C compiler.
# One wheel per supported CPython, matching requires-python and the classifiers
# above. Listed explicitly so a newly released Python isn't built before PyTorch
# (a required dependency) publishes wheels for it.
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# Skip platforms PyTorch doesn't publish wheels for, where metapredict couldn't
# be installed anyway: free-threaded CPython, musl Linux and 32-bit builds.
skip = ["cp3??t-*", "*-musllinux_*", "*-manylinux_i686", "*-win32"]
# Install each built wheel and check its compiled extension loads and gives the
# same domains as the pure-Python fallback.
test-sources = ["devtools/check_cython_extension.py"]
test-command = "python devtools/check_cython_extension.py"

[tool.cibuildwheel.linux]
# PyPI's Linux PyTorch wheels pull in several GB of CUDA libraries; the CPU-only
# build is all the wheel check needs
before-test = "pip install torch --index-url https://download.pytorch.org/whl/cpu"

[tool.cibuildwheel.macos]
# PyTorch 2.3 and later (which metapredict requires) have no Intel macOS
# wheels, so only build for Apple silicon
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.coverage.run]
omit = [
    # Omit the tests
    "*/tests/*",
    # Omit the generated versioningit file
    "metapredict/_version.py",
]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "metapredict/_version.py"
