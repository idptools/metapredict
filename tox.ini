# tox configuration for testing metapredict across Python versions and across the
# versions of its runtime dependencies (PyTorch, scipy, pytorch_lightning). Uses
# the tox-uv plugin so every environment is built with uv (fast, and uv fetches
# any interpreter it needs).
#
# Axes:
#
#   * py39 .. py314             - the test suite on each supported Python with the
#                                 latest dependencies.
#   * py311-torch20 .. 28       - Python 3.11 with a specific PyTorch pinned.
#   * py311-lightning20 .. 25   - Python 3.11 with a specific pytorch_lightning.
#   * py311-scipy110 .. 116     - Python 3.11 with a specific scipy.
#
# The dependency sweeps run on Python 3.11 (widest wheel coverage) and pin one
# dependency per environment. Run a sweep and take the lowest env that is green as
# the minimum supported version of that dependency.
#
# Examples:
#   uvx --with tox-uv tox                     # every environment
#   uvx --with tox-uv tox -l                  # list the environments
#   uvx --with tox-uv tox -e py312            # one Python version, latest deps
#   uvx --with tox-uv tox -e py311-torch21    # Python 3.11 with PyTorch 2.1.*
#   uvx --with tox-uv tox -m torch            # the PyTorch sweep
#   uvx --with tox-uv tox -m lightning        # the pytorch_lightning sweep
#   uvx --with tox-uv tox -m scipy            # the scipy sweep
#
# (If tox and tox-uv are already installed you can drop the `uvx --with tox-uv`
# prefix and just run `tox`.)
#
# NumPy and Cython (build dependencies) are not swept here -- a build-isolated
# tox wheel would compile once against a single NumPy/Cython. Use
# devtools/test-build-deps.sh for those. See devtools/README.md for the full
# "Running the test suites" guide.

[tox]
requires =
    tox>=4.11
    tox-uv>=1.11
env_list =
    py39, py310, py311, py312, py313, py314
    py311-torch{20, 21, 22, 23, 24, 25, 26, 27, 28}
    py311-lightning{20, 21, 22, 23, 24, 25}
    py311-scipy{110, 111, 112, 113, 114, 115, 116}
labels =
    torch = py311-torch20, py311-torch21, py311-torch22, py311-torch23, py311-torch24, py311-torch25, py311-torch26, py311-torch27, py311-torch28
    lightning = py311-lightning20, py311-lightning21, py311-lightning22, py311-lightning23, py311-lightning24, py311-lightning25
    scipy = py311-scipy110, py311-scipy111, py311-scipy112, py311-scipy113, py311-scipy114, py311-scipy115, py311-scipy116

[testenv]
# Build and install a wheel of metapredict (compiling the Cython extension) plus
# its test extras into each isolated environment.
runner = uv-venv-runner
package = wheel
extras = test
# When a torchXY factor is present, pin PyTorch to that minor version via a uv
# constraint file. Because metapredict only requires an unpinned `torch`, a plain
# pre-install pin is re-resolved (and upgraded) when the package is installed;
# UV_CONSTRAINT is honoured by *every* uv operation in the environment (including
# the package resolution), so the pin actually sticks. Environments without a
# torch factor use whatever the resolver picks (the latest compatible PyTorch).
set_env =
    torch20: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch20.txt
    torch21: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch21.txt
    torch22: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch22.txt
    torch23: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch23.txt
    torch24: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch24.txt
    torch25: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch25.txt
    torch26: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch26.txt
    torch27: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch27.txt
    torch28: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/torch28.txt
    lightning20: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/lightning20.txt
    lightning21: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/lightning21.txt
    lightning22: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/lightning22.txt
    lightning23: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/lightning23.txt
    lightning24: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/lightning24.txt
    lightning25: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/lightning25.txt
    scipy110: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/scipy110.txt
    scipy111: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/scipy111.txt
    scipy112: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/scipy112.txt
    scipy113: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/scipy113.txt
    scipy114: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/scipy114.txt
    scipy115: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/scipy115.txt
    scipy116: UV_CONSTRAINT = {toxinidir}/devtools/version-constraints/scipy116.txt
# The tests read fixtures via paths relative to the tests directory.
change_dir = metapredict/tests
commands =
    python -c "import torch, scipy, pytorch_lightning as pl; print('Testing with torch', torch.__version__, '| scipy', scipy.__version__, '| lightning', pl.__version__)"
    pytest {posargs:-v}
